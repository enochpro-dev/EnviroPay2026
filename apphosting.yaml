# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBiJKzIvyfu5oet7pK_sXZPaE6ym2GUeUE
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: enviropay-io.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: enviropay-io
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: enviropay-io.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "94070414705"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:94070414705:web:973400861a500a6edcaad0
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-CJ7XJS54C2
    availability:
      - BUILD
      - RUNTIME
  # Formspree endpoint ID for email notifications (create at formspree.io)
  - variable: NEXT_PUBLIC_FORMSPREE_ENDPOINT
    value: meelderq
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_MAPBOX_TOKEN
    secret: NEXT_PUBLIC_MAPBOX_TOKEN
    availability:
      - BUILD
      - RUNTIME
